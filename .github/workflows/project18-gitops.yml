
name: Project 18 - GitOps Deployment

on:
  pull_request:
    branches: [main]
    paths:
      - 'Project 18/**'
      - '.github/workflows/project18-gitops.yml'

  push:
    branches: [main]
    paths:
      - 'Project 18/**'
      - '.github/workflows/project18-gitops.yml'

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: project18-deployment
  cancel-in-progress: false

jobs:
  validate:
    name: Terraform Validate
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: 'Project 18'

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

  apply:
    name: Terraform Apply
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production

    defaults:
      run:
        working-directory: 'Project 18'

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Check AWS role configuration
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
        run: |
          if [ -z "$AWS_ROLE_ARN" ]; then
            echo "::error::Set the AWS_ROLE_ARN Actions variable in the production environment or repository to an IAM role trusted for GitHub OIDC."
            exit 1
          fi

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
